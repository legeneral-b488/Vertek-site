<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vertek — Drone Photo &amp; Vidéo</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@500;600;700&family=Barlow+Condensed:wght@300;400;500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="gallery-config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #faf7f1;
      --bg2:   #f0ede4;
      --bg3:   #ffffff;
      --text:  #1c1a14;
      --muted: #857f72;
      --border: rgba(0,0,0,0.08);
      --gold:      #cfae6a;
      --gold-deep: #a87f3d;
      --lux-bg:    #171209;
      --lux-ink:   #eee5d3;
      --steel:      #4a7a96;
      --steel-deep: #16242c;
      --alert: #c0392b;
      --green: #5a9e78;
      --font-display: 'Barlow Condensed', sans-serif;
      --font-body:    'Barlow', sans-serif;
      --font-epic:    'Anton', sans-serif;
      --font-lux:     'Cinzel', serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; overflow-x: hidden; }
    ::selection { background: rgba(207,174,106,.4); color: var(--text); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }
    section[id] { scroll-margin-top: 76px; }
    #root { min-height: 100vh; }

    /* —— NAV —— */
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 5vw;height:72px;display:flex;align-items:center;justify-content:space-between;transition:background .35s,box-shadow .35s;}
    .nav.on-hero .nav-link{color:rgba(255,255,255,.72);}
    .nav.on-hero .nav-link:hover{color:#fff;}
    .nav.on-hero .nav-mob-btn{color:#fff;}
    .nav.scrolled{background:rgba(242,240,235,.95);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--border);}
    .nav.on-hero.scrolled .nav-link{color:var(--muted);}
    .nav.on-hero.scrolled .nav-link:hover{color:var(--text);}
    .nav.on-hero.scrolled .nav-mob-btn{color:var(--text);}
    .nav-links{display:flex;gap:22px;list-style:none;}
    .nav-link{font-family:var(--font-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s;}
    .nav-link:hover{color:var(--text);}
    .nav-cta-btn{font-family:var(--font-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:10px 22px;background:var(--gold);color:#171209;font-weight:700;border:none;cursor:pointer;transition:background .2s;text-decoration:none;}
    .nav-cta-btn:hover{background:#e0c485;}
    .nav-mob-btn{display:none;background:none;border:none;cursor:pointer;color:var(--text);}
    .mob-menu{display:none;position:fixed;inset:0;background:#fff;z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:28px;}
    .mob-menu.open{display:flex;}
    .mob-menu a{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text);text-decoration:none;}
    .mob-close{position:absolute;top:18px;right:5vw;background:none;border:none;color:var(--text);cursor:pointer;}
    @media(max-width:980px){.nav-links{display:none;}.nav-cta-btn{display:none;}.nav-mob-btn{display:block;}}

    /* —— BUTTONS —— */
    .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:14px 30px;cursor:pointer;transition:all .2s;text-decoration:none;border:none;}
    .btn:hover{transform:translateY(-1px);}
    .btn-paper{background:#f3ead8;color:#171209;box-shadow:4px 4px 0 rgba(0,0,0,.55);}
    .btn-paper:hover{background:#fff;}
    .btn-w{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.38);}
    .btn-w:hover{border-color:#fff;background:rgba(255,255,255,.08);}
    .btn-gold{background:var(--gold);color:#171209;}
    .btn-gold:hover{background:#e0c485;}
    .btn-steel{background:var(--steel);color:#fff;}
    .btn-steel:hover{background:#5d90ad;}
    .btn-red{background:var(--alert);color:#fff;}
    .btn-red:hover{background:#d4503e;}
    .btn-g{background:transparent;color:var(--muted);border:1px solid var(--border);font-size:13px;padding:11px 24px;}
    .btn-g:hover{color:var(--text);border-color:rgba(0,0,0,.25);}

    /* —— HERO —— */
    .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:120px 5vw 90px;color:#fff;}
    .hero-vid-wrap{position:absolute;inset:0;z-index:0;overflow:hidden;background:#0a0c09;}
    .hero-vid-wrap video{width:100%;height:100%;object-fit:cover;opacity:.6;}
    .hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(170deg,rgba(4,5,3,.6) 0%,rgba(4,5,3,.42) 45%,rgba(4,5,3,.8) 100%);}
    .hero-content{position:relative;z-index:2;max-width:1000px;width:100%;}
    .hero-kicker{font-family:var(--font-display);font-size:clamp(11px,1.4vw,14px);letter-spacing:.42em;text-transform:uppercase;color:rgba(255,255,255,.78);margin-bottom:20px;}
    .hero-vertek{font-family:var(--font-epic);font-size:clamp(68px,14vw,184px);line-height:.98;letter-spacing:.05em;text-transform:uppercase;color:#f3ead8;-webkit-text-stroke:4px #0d0b07;paint-order:stroke fill;text-shadow:7px 9px 0 rgba(8,6,3,.85),0 24px 70px rgba(0,0,0,.5);margin-bottom:24px;}
    @media(max-width:640px){.hero-vertek{-webkit-text-stroke:2.5px #0d0b07;text-shadow:4px 5px 0 rgba(8,6,3,.85);}}
    .hero-sub{font-size:clamp(15px,2vw,19px);color:rgba(255,255,255,.78);max-width:560px;margin:0 auto 40px;font-weight:300;line-height:1.7;}
    .hero-sub b{font-weight:600;color:#fff;}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.24);padding:6px 16px;margin-bottom:30px;backdrop-filter:blur(6px);}
    .hero-dot{width:5px;height:5px;background:var(--gold);border-radius:50%;animation:blink 2s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
    .hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}

    /* —— DRONE SCANNER —— */
    .drone-scanner{position:absolute;inset:0;z-index:3;pointer-events:none;}
    body.no-scan .drone-scanner{display:none;}
    @keyframes prop-spin{to{transform:rotate(360deg)}}
    @keyframes drone-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .drone-unit{position:absolute;width:0;height:0;transition:left 2.6s cubic-bezier(.45,.05,.35,1),top 2.6s cubic-bezier(.45,.05,.35,1);}
    .drone-svg-wrap{position:absolute;left:-26px;top:-18px;animation:drone-bob 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 12px rgba(0,0,0,.55));}
    .prop{transform-origin:50% 50%;transform-box:fill-box;animation:prop-spin .12s linear infinite;}
    .scan-cone{position:absolute;left:26px;top:-16px;opacity:0;transition:opacity .5s ease;}
    .scanning .scan-cone{opacity:1;}
    @keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
    .sweep{transform-origin:0px 55px;animation:sweep 1.5s ease-in-out infinite alternate;}
    .scan-lbl{position:absolute;left:24px;top:-28px;font-family:monospace;font-size:10px;letter-spacing:.2em;color:#ffd080;opacity:0;transition:opacity .4s;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.7);}
    .scanning .scan-lbl{opacity:1;animation:blink 1s infinite;}
    @media(prefers-reduced-motion:reduce){.drone-scanner{display:none;}}

    /* —— SERVICE TABS —— */
    .svc-tabs{position:sticky;top:72px;z-index:95;display:grid;grid-template-columns:repeat(3,1fr);background:#12100b;box-shadow:0 10px 34px rgba(0,0,0,.3);}
    .svc-tab{appearance:none;border:none;background:transparent;cursor:pointer;padding:18px 10px 20px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--font-display);text-transform:uppercase;color:rgba(255,255,255,.62);border-top:3px solid var(--c,transparent);transition:background .25s,color .25s;}
    .svc-tab .t-name{font-size:clamp(13px,1.6vw,20px);font-weight:700;letter-spacing:.13em;line-height:1.15;}
    .svc-tab .t-hint{font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.34);}
    .svc-tab:hover{background:rgba(255,255,255,.06);color:#fff;}
    .svc-tab.active{background:var(--c,#666);color:#fff;}
    .svc-tab.active .t-hint{color:rgba(255,255,255,.72);}
    @media(max-width:640px){.svc-tab{padding:14px 6px 16px;}.svc-tab .t-hint{display:none;}}

    /* —— SECTIONS —— */
    .sec{padding:96px 5vw;}
    .sec-lbl{font-family:var(--font-display);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--green);margin-bottom:14px;}
    .sec-title{font-family:var(--font-display);font-size:clamp(34px,5vw,58px);font-weight:800;text-transform:uppercase;line-height:1;margin-bottom:18px;letter-spacing:-.01em;color:var(--text);}
    .sec-sub{color:var(--muted);font-size:16px;max-width:560px;font-weight:300;line-height:1.7;}
    .svc-panel{animation:panel-in .45s ease both;}
    @keyframes panel-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

    /* —— IMMOBILIER (LUXE) —— */
    .lux{background:radial-gradient(1100px 480px at 50% -8%,#261c0d 0%,var(--lux-bg) 62%);color:var(--lux-ink);}
    .lux-lbl{font-family:var(--font-display);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;}
    .lux-title{font-family:var(--font-lux);font-weight:600;font-size:clamp(34px,5vw,60px);color:#f0e6cf;line-height:1.05;}
    .lux-rule{width:72px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:20px 0 16px;}
    .lux-sub{color:rgba(238,229,211,.62);max-width:580px;font-weight:300;line-height:1.75;}
    .lux-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:52px;max-width:1160px;margin-left:auto;margin-right:auto;}
    .lux-card{border:1px solid rgba(207,174,106,.26);padding:38px 30px;background:linear-gradient(180deg,rgba(207,174,106,.07),rgba(207,174,106,.015));position:relative;transition:border-color .3s,transform .3s;display:flex;flex-direction:column;}
    .lux-card:hover{border-color:rgba(207,174,106,.65);transform:translateY(-3px);}
    .lux-card.feat{border-color:var(--gold);background:linear-gradient(180deg,rgba(207,174,106,.12),rgba(207,174,106,.03));}
    .lux-tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:#171209;font-family:var(--font-display);font-size:10px;letter-spacing:.22em;text-transform:uppercase;padding:4px 14px;font-weight:700;white-space:nowrap;}
    .lux-name{font-family:var(--font-lux);font-size:21px;font-weight:600;color:#f0e6cf;letter-spacing:.04em;margin-bottom:10px;}
    .lux-price{font-family:var(--font-display);font-size:36px;font-weight:800;color:var(--gold);line-height:1;}
    .lux-alt{font-size:12px;color:rgba(238,229,211,.5);margin-top:5px;}
    .lux-tva{font-size:11px;color:rgba(238,229,211,.38);margin-top:8px;}
    .lux-inc{margin-top:24px;display:flex;flex-direction:column;gap:10px;flex:1;}
    .lux-inc span{display:flex;align-items:flex-start;gap:9px;font-size:14px;color:rgba(238,229,211,.78);font-weight:300;}
    .lux-inc .ck{color:var(--gold);flex-shrink:0;margin-top:4px;}
    .lux-remise{margin-top:80px;text-align:center;border-top:1px solid rgba(207,174,106,.2);padding-top:60px;max-width:1160px;margin-left:auto;margin-right:auto;}
    .lux-remise-title{font-family:var(--font-lux);font-size:clamp(30px,4.5vw,54px);font-weight:600;letter-spacing:.14em;color:#f0e6cf;text-transform:uppercase;}
    .lux-remise-sub{color:rgba(238,229,211,.55);font-size:14px;margin-top:10px;font-weight:300;}
    .lux-remise-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:820px;margin:42px auto 0;}
    .lux-pct{font-family:var(--font-epic);font-size:clamp(64px,9vw,124px);line-height:1;background:linear-gradient(180deg,#eed79e 8%,#a87f3d 92%);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .lux-pct-lbl{font-family:var(--font-display);letter-spacing:.22em;text-transform:uppercase;color:rgba(238,229,211,.68);font-size:clamp(13px,1.5vw,16px);margin-top:10px;}
    .lux-footer-tva{margin-top:44px;font-size:12px;color:rgba(238,229,211,.38);}
    @media(max-width:920px){.lux-grid{grid-template-columns:1fr;max-width:480px;}.lux-remise-grid{grid-template-columns:1fr;gap:36px;}}

    /* —— INSPECTION —— */
    .insp{background:var(--bg);}
    .insp-disclaim{margin-top:18px;padding:16px 20px;border-left:2px solid var(--steel);background:rgba(74,122,150,.07);font-size:14px;color:var(--muted);max-width:640px;font-style:italic;}
    .insp-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:26px;margin-top:46px;align-items:start;max-width:1160px;margin-left:auto;margin-right:auto;}
    .insp-block-lbl{font-family:var(--font-display);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--steel);margin:0 0 14px;}
    .insp-forfaits{display:flex;flex-direction:column;gap:12px;}
    .insp-f{background:var(--bg3);border:1px solid var(--border);padding:22px 26px;cursor:pointer;display:flex;gap:16px;transition:border-color .2s,box-shadow .2s;position:relative;}
    .insp-f:hover{border-color:rgba(74,122,150,.55);}
    .insp-f.sel{border-color:var(--steel);box-shadow:0 0 0 1px var(--steel),0 12px 32px rgba(74,122,150,.13);}
    .insp-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--steel);flex:none;margin-top:4px;display:flex;align-items:center;justify-content:center;}
    .insp-dot i{width:8px;height:8px;border-radius:50%;background:var(--steel);opacity:0;transition:opacity .15s;}
    .insp-f.sel .insp-dot i{opacity:1;}
    .insp-fhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
    .insp-fname{font-family:var(--font-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text);}
    .insp-fprice{margin-left:auto;font-family:var(--font-display);font-size:25px;font-weight:800;color:var(--steel);white-space:nowrap;line-height:1;}
    .insp-fdesc{font-size:13.5px;color:var(--muted);line-height:1.65;margin-top:7px;}
    .insp-fkeep{display:inline-block;font-family:var(--font-display);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--steel);border:1px solid rgba(74,122,150,.35);padding:2px 9px;margin-top:11px;}
    .insp-reco{position:absolute;top:0;right:0;background:var(--steel);color:#fff;font-family:var(--font-display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:3px 11px;font-weight:700;}
    .insp-opts{display:flex;flex-direction:column;gap:8px;margin-top:34px;}
    .insp-opt{display:flex;align-items:center;gap:12px;padding:13px 18px;background:var(--bg3);border:1px solid var(--border);cursor:pointer;transition:border-color .15s;font-size:14px;color:var(--text);}
    .insp-opt:hover{border-color:rgba(74,122,150,.5);}
    .insp-opt input{accent-color:var(--steel);width:15px;height:15px;cursor:pointer;flex:none;}
    .insp-opt .o-price{margin-left:auto;font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--steel);white-space:nowrap;}
    .insp-opt.devis .o-price{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
    .insp-sum{position:sticky;top:175px;background:var(--steel-deep);color:#fff;padding:32px 30px;}
    .insp-sum-lbl{font-family:var(--font-display);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:12px;}
    .insp-total{font-family:var(--font-display);font-size:56px;font-weight:800;color:#8ec3e0;line-height:1;letter-spacing:-.01em;}
    .insp-total small{font-size:22px;font-weight:600;color:rgba(142,195,224,.7);}
    .insp-sum-lines{display:flex;flex-direction:column;gap:7px;margin:20px 0;}
    .insp-line{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:rgba(255,255,255,.62);border-bottom:1px dashed rgba(255,255,255,.12);padding-bottom:7px;}
    .insp-line span:last-child{font-family:var(--font-display);font-weight:600;color:rgba(255,255,255,.85);white-space:nowrap;}
    .insp-sum-note{font-size:11.5px;color:rgba(255,255,255,.38);line-height:1.6;margin-top:16px;}
    .insp-bas{margin-top:70px;max-width:1160px;margin-left:auto;margin-right:auto;}
    .insp-bas-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:26px;}
    .insp-bas-card{background:var(--bg3);padding:26px 28px;border-top:2px solid rgba(74,122,150,.4);}
    .insp-bas-card h5{font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
    .insp-bas-card p{font-size:13.5px;color:var(--muted);line-height:1.65;}
    .insp-tva{margin-top:22px;font-size:12px;color:var(--muted);}
    @media(max-width:920px){.insp-grid{grid-template-columns:1fr;}.insp-sum{position:static;}.insp-bas-grid{grid-template-columns:1fr;}}

    /* —— SINISTRE —— */
    .sin{background:var(--bg2);}
    .sin-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:48px;max-width:1160px;margin-left:auto;margin-right:auto;align-items:start;}
    .sin-card{background:var(--bg3);border:1px solid var(--border);padding:40px 36px;position:relative;}
    .sin-num{font-family:var(--font-display);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
    .sin-h{font-family:var(--font-display);font-size:25px;font-weight:700;text-transform:uppercase;line-height:1.1;color:var(--text);margin-bottom:14px;}
    .sin-body{font-size:14px;color:var(--muted);line-height:1.7;}
    .sin-urgent{border:2px solid var(--alert);animation:urgent-pulse 1.8s infinite;}
    body.no-pulse .sin-urgent{animation:none;}
    @keyframes urgent-pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.4)}70%{box-shadow:0 0 0 15px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
    @media(prefers-reduced-motion:reduce){.sin-urgent{animation:none;}}
    .sin-urgent .sin-h{color:var(--alert);}
    .sin-badge{position:absolute;top:-14px;left:32px;background:var(--alert);color:#fff;font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:5px 14px;display:flex;gap:8px;align-items:center;}
    .sin-badge .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1s infinite;}
    .sin-table{margin-top:24px;border-top:1px solid var(--border);}
    .sin-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:13px 2px;border-bottom:1px dashed var(--border);font-size:14px;color:var(--muted);}
    .sin-row b{font-family:var(--font-display);font-size:21px;color:var(--text);font-weight:800;white-space:nowrap;}
    .sin-urgent .sin-row b{color:var(--alert);}
    .sin-note{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.6;}
    .sin-call{margin:36px auto 0;max-width:1160px;background:#23100c;color:#fff;padding:40px 38px;display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap;}
    .sin-call-h{font-family:var(--font-display);font-size:clamp(22px,3vw,30px);font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1.1;}
    .sin-call-sub{font-size:13.5px;color:rgba(255,255,255,.55);margin-top:6px;max-width:420px;}
    .sin-tel{font-family:var(--font-epic);font-size:clamp(28px,4vw,44px);color:#ff9582;text-decoration:none;letter-spacing:.05em;white-space:nowrap;transition:color .2s;}
    .sin-tel:hover{color:#ffb3a5;}
    .sin-tva{margin-top:22px;font-size:12px;color:var(--muted);text-align:center;}
    @media(max-width:860px){.sin-grid{grid-template-columns:1fr;}}

    /* —— WHO —— */
    .who-wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;max-width:1160px;margin:52px auto 0;}
    .who-medals{display:flex;gap:32px;justify-content:center;flex-wrap:wrap;}
    .medal-item{display:flex;flex-direction:column;align-items:center;gap:10px;}
    .medal-lbl{font-family:var(--font-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;}
    .medal-valid{font-family:var(--font-display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);background:rgba(90,158,120,.1);border:1px solid rgba(90,158,120,.3);padding:3px 10px;margin-top:4px;}
    @media(max-width:760px){.who-wrap{grid-template-columns:1fr;gap:36px;}.who-medals{gap:20px;}}

    /* —— BEVERT (structure sœur) —— */
    .bevert-card{position:relative;overflow:hidden;display:block;margin-top:12px;padding:18px 22px;background:linear-gradient(135deg,#2e5c44,#4d8f66);border:1px solid rgba(255,255,255,.15);text-decoration:none;transition:transform .25s,box-shadow .25s;}
    .bevert-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(46,92,68,.35);}
    .bevert-lbl{position:relative;font-family:var(--font-display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.75);display:block;margin-bottom:8px;}
    .bevert-name{position:relative;color:#fff;font-family:var(--font-display);font-weight:700;letter-spacing:.06em;font-size:14px;}
    .bevert-desc{position:relative;display:block;margin-top:2px;font-size:13px;color:rgba(255,255,255,.82);}

    /* —— WHY —— */
    .why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:52px;max-width:1160px;margin-left:auto;margin-right:auto;}
    .why-card{padding:42px 34px;background:var(--bg3);border-bottom:3px solid transparent;transition:border-color .3s,box-shadow .3s;}
    .why-card:hover{border-bottom-color:var(--green);box-shadow:0 6px 30px rgba(0,0,0,.06);}
    .why-ico{width:46px;height:46px;margin-bottom:22px;color:var(--green);}
    .why-title{font-family:var(--font-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;color:var(--text);}
    .why-body{color:var(--muted);font-size:14px;line-height:1.7;}
    .why-badge{display:inline-block;font-family:var(--font-display);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--green);border:1px solid rgba(90,158,120,.4);padding:3px 10px;margin-top:14px;}
    @media(max-width:760px){.why-grid{grid-template-columns:1fr;}}

    /* —— BIBLIOTHÈQUE —— */
    .lib-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:34px;}
    .lib-chip{font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:9px 18px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);cursor:pointer;transition:all .15s;}
    .lib-chip:hover{color:var(--text);border-color:rgba(0,0,0,.25);}
    .lib-chip.active{background:var(--text);color:#fff;border-color:var(--text);}
    .lib-wrap{max-width:1160px;margin:0 auto;}
    .lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:22px;}
    .lib-cell{position:relative;height:250px;overflow:hidden;background:#d8d4cb;cursor:pointer;}
    .lib-cell img,.lib-cell video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease;}
    .lib-cell:hover img,.lib-cell:hover video{transform:scale(1.05);}
    .lib-cat{position:absolute;top:12px;left:12px;font-family:var(--font-display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.5);padding:3px 9px;z-index:2;backdrop-filter:blur(4px);}
    .lib-lbl{position:absolute;bottom:12px;left:12px;font-family:var(--font-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#fff;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.65);}
    .lib-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;transition:opacity .3s;backdrop-filter:blur(4px);z-index:3;}
    .lib-cell:hover .lib-play{opacity:1;}
    @media(max-width:860px){.lib-grid{grid-template-columns:1fr 1fr;}.lib-cell{height:190px;}}
    @media(max-width:540px){.lib-grid{grid-template-columns:1fr;}}

    /* —— LIGHTBOX —— */
    .lb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:2000;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .lb-box{position:relative;max-width:92vw;max-height:92vh;cursor:default;display:flex;flex-direction:column;align-items:center;gap:14px;}
    .lb-close{position:absolute;top:-44px;right:0;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1;opacity:.7;transition:opacity .2s;}
    .lb-close:hover{opacity:1;}
    .lb-caption{font-family:var(--font-display);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.55);}

    /* —— CONTACT —— */
    .contact-wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px;max-width:1060px;margin:52px auto 0;}
    .cinfo-item{display:flex;align-items:flex-start;gap:14px;margin-bottom:24px;}
    .cinfo-ico{color:var(--green);margin-top:2px;flex-shrink:0;}
    .cinfo-lbl{font-family:var(--font-display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
    .cinfo-val{font-size:15px;color:var(--text);}
    .copy-btn{margin-top:7px;font-family:var(--font-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s;}
    .copy-btn:hover{color:var(--text);border-color:rgba(0,0,0,.3);}
    @media(max-width:760px){.contact-wrap{grid-template-columns:1fr;gap:36px;}}

    /* —— FOOTER —— */
    footer{background:#171209;padding:32px 5vw;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
    .footer-wm{font-family:var(--font-epic);font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,234,216,.8);text-decoration:none;}
    .ftxt{font-size:13px;color:rgba(255,255,255,.35);}
    .flinks{display:flex;gap:22px;}
    .flinks a{font-family:var(--font-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35);text-decoration:none;transition:color .2s;}
    .flinks a:hover{color:rgba(255,255,255,.75);}
    .footer-legal{font-size:11px;color:rgba(255,255,255,.22);width:100%;text-align:center;padding-top:8px;border-top:1px solid rgba(255,255,255,.07);}
    .footer-legal a{color:rgba(255,255,255,.35);text-decoration:none;transition:color .2s;}
    .footer-legal a:hover{color:rgba(255,255,255,.7);}

    /* —— TWEAKS PANEL —— */
    .tweaks-panel{position:fixed;bottom:24px;right:24px;width:256px;background:#fff;border:1px solid var(--border);z-index:9999;box-shadow:0 12px 48px rgba(0,0,0,.14);}
  </style>
</head>

<script type="text/babel" src="site/panels.jsx"></script>
<script type="text/babel" src="site/sections.jsx"></script>
<script type="text/babel" src="site/app.jsx"></script>
