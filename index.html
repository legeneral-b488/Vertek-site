<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vertek — Drone Photo & Vidéo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="gallery-config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #faf7f1;
      --bg2:   #f0ede4;
      --bg3:   #ffffff;
      --text:  #1c1a14;
      --muted: #857f72;
      --accent:       #5a9e78;
      --accent-bright:#72bc92;
      --accent-dim:   #b8ddc8;
      --warm:         #e8834a;
      --warm-dim:     #fad4bc;
      --sky:          #4a8ab4;
      --border: rgba(0,0,0,0.08);
      --font-display: 'Barlow Condensed', sans-serif;
      --font-body:    'Barlow', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; overflow-x: hidden; }
    ::selection { background: var(--accent-dim); color: var(--text); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── LOGO ── */
const LogoSVG = () => (
  <svg width="48" height="48" viewBox="0 0 400 480" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M 50 80 L 350 80 L 280 180 L 200 280 L 120 180 Z" fill="currentColor" stroke="currentColor" strokeWidth="20" strokeLinejoin="round" strokeLinecap="round"/>
    <path d="M 140 200 L 200 300 L 260 200" fill="currentColor" stroke="currentColor" strokeWidth="20" strokeLinejoin="round" strokeLinecap="round"/>
  </svg>
);
const LogoSmall = () => (
  <svg width="32" height="32" viewBox="0 0 400 480" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
    <path d="M 50 80 L 350 80 L 280 180 L 200 280 L 120 180 Z M 140 200 L 200 300 L 260 200" fillRule="evenodd"/>
  </svg>
);

/* ── LOGO IMAGE (remplace le SVG si assets/logo.png existe) ── */
function LogoImg({ size = 40 }) {
  const [failed, setFailed] = useState(false);
  if (failed) return <LogoSmall />;
  return (
    <img
      src="assets/logo.png"
      alt="Vertek"
      style={{ height: size, maxWidth: size * 4, objectFit: 'contain', display: 'block' }}
      onError={() => setFailed(true)}
    />
  );
}

/* ── ICÔNES ── */
const Arr = () => (
  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
    <path d="M2 7h10M7 2l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);
const Chk = () => (
  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
    <path d="M2 7l4 4 6-6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);
const MenuIco = () => (
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
    <path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
  </svg>
);
const CloseIco = () => (
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
    <path d="M5 5l12 12M17 5L5 17" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
  </svg>
);
const MailIco = () => (
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
    <rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" strokeWidth="1.4"/>
    <path d="M2 7l8 5 8-5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
  </svg>
);
const PhoneIco = () => (
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
    <path d="M4 2h4l2 5-2.5 1.5a11 11 0 005 5L14 11l5 2v4a2 2 0 01-2 2C7.2 19 1 12.8 1 5a2 2 0 012-2h1z" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);

/* ── GLOBAL CSS ── */
const css = `
/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 5vw;height:72px;display:flex;align-items:center;justify-content:space-between;transition:background .35s,box-shadow .35s;}
.nav.on-hero .nav-logo img{filter:brightness(0) invert(1);}
.nav.on-hero .nav-link{color:rgba(255,255,255,.7);}
.nav.on-hero .nav-link:hover{color:#fff;}
.nav.on-hero .nav-mob-btn{color:#fff;}
.nav.scrolled{background:rgba(242,240,235,.95);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--border);}
.nav.on-hero.scrolled .nav-logo img{filter:none;}
.nav.on-hero.scrolled .nav-link{color:var(--muted);}
.nav.on-hero.scrolled .nav-link:hover{color:var(--text);}
.nav.on-hero.scrolled .nav-mob-btn{color:var(--text);}
.nav-wordmark{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--text);transition:color .3s;line-height:1;}
.nav.on-hero .nav-wordmark{color:#fff;}
.nav.on-hero.scrolled .nav-wordmark{color:var(--text);}
.nav-links{display:flex;gap:22px;list-style:none;}
.nav-link{font-family:var(--font-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s;}
.nav-link:hover{color:var(--text);}
.nav-cta-btn{font-family:var(--font-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:10px 22px;background:var(--accent);color:#fff;font-weight:700;border:none;cursor:pointer;transition:background .2s;text-decoration:none;}
.nav-cta-btn:hover{background:var(--accent-bright);}
.nav-mob-btn{display:none;background:none;border:none;cursor:pointer;color:var(--text);}
.mob-menu{display:none;position:fixed;inset:0;background:#fff;z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:28px;}
.mob-menu.open{display:flex;}
.mob-menu a{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text);text-decoration:none;}
.mob-close{position:absolute;top:18px;right:5vw;background:none;border:none;color:var(--text);cursor:pointer;}
@media(max-width:980px){.nav-links{display:none;}.nav-cta-btn{display:none;}.nav-mob-btn{display:block;}}

/* HERO */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:120px 5vw 80px;color:#fff;}
.hero-vid-wrap{position:absolute;inset:0;z-index:0;overflow:hidden;background:#0a0c09;}
.hero-vid-wrap video{width:100%;height:100%;object-fit:cover;opacity:.55;}
.hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(170deg,rgba(4,5,3,.62) 0%,rgba(4,5,3,.48) 45%,rgba(4,5,3,.78) 100%);}
.hero-content{position:relative;z-index:2;max-width:920px;width:100%;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.22);padding:6px 16px;margin-bottom:30px;backdrop-filter:blur(6px);}
.hero-dot{width:5px;height:5px;background:var(--accent-bright);border-radius:50%;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hero-title{font-family:var(--font-display);font-size:clamp(50px,9vw,108px);font-weight:800;line-height:.9;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:26px;text-shadow:0 4px 40px rgba(0,0,0,.5);}
.hero-title em{font-style:normal;color:#ffd080;}
.hero-sub{font-size:clamp(15px,2vw,18px);color:rgba(255,255,255,.72);max-width:510px;margin:0 auto 42px;font-weight:300;line-height:1.7;}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.hero-scroll{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;color:rgba(255,255,255,.45);font-family:var(--font-display);font-size:10px;letter-spacing:.22em;text-transform:uppercase;z-index:2;animation:drift 3s ease-in-out infinite;}
@keyframes drift{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(7px)}}
.hero-scroll-line{width:1px;height:38px;background:linear-gradient(to bottom,rgba(255,255,255,.4),transparent);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:14px 30px;cursor:pointer;transition:all .2s;text-decoration:none;border:none;}
.btn-p{background:var(--accent);color:#fff;}
.btn-p:hover{background:var(--accent-bright);transform:translateY(-1px);}
.btn-w{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.32);}
.btn-w:hover{border-color:#fff;background:rgba(255,255,255,.08);transform:translateY(-1px);}
.btn-d{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn-d:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}
.btn-g{background:transparent;color:var(--muted);border:1px solid var(--border);font-size:13px;padding:11px 24px;}
.btn-g:hover{color:var(--text);border-color:var(--accent-dim);}

/* TRUST BAR */
.trust{background:var(--bg3);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:48px 5vw;display:flex;align-items:center;justify-content:center;gap:60px;flex-wrap:wrap;}
.trust-item{display:flex;align-items:center;gap:16px;}
.trust-val{font-family:var(--font-display);font-size:52px;font-weight:800;color:var(--accent);}
.trust-lbl{font-size:15px;color:var(--muted);line-height:1.35;max-width:120px;}
.trust-sep{width:1px;height:60px;background:var(--border);}

/* SECTIONS */
.sec{padding:96px 5vw;}
.sec-lbl{font-family:var(--font-display);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}
.sec-title{font-family:var(--font-display);font-size:clamp(34px,5vw,58px);font-weight:800;text-transform:uppercase;line-height:1;margin-bottom:18px;letter-spacing:-.01em;color:var(--text);}
.sec-sub{color:var(--muted);font-size:16px;max-width:460px;font-weight:300;line-height:1.7;}

/* PROBLEM / SOLUTION */
.ps-wrap{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:52px;max-width:1160px;margin-left:auto;margin-right:auto;}
.ps-card{padding:44px 40px;}
.ps-card-problem{background:#fff8f4;border-top:3px solid #e8834a;}
.ps-card-solution{background:#f2faf6;border-top:3px solid var(--accent);}
.ps-tag{font-family:var(--font-display);font-size:10px;letter-spacing:.25em;text-transform:uppercase;padding:3px 10px;display:inline-block;margin-bottom:18px;}
.ps-tag-p{color:#c06030;background:rgba(232,131,74,.1);}
.ps-tag-s{color:var(--accent);background:rgba(114,138,154,.12);}
.ps-h{font-family:var(--font-display);font-size:24px;font-weight:700;text-transform:uppercase;margin-bottom:14px;line-height:1.1;color:var(--text);}
.ps-body{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:18px;}
.ps-list{list-style:none;display:flex;flex-direction:column;gap:9px;}
.ps-list li{display:flex;align-items:flex-start;gap:9px;color:var(--muted);font-size:14px;}
.ps-ico-x{color:#c07040;margin-top:1px;flex-shrink:0;font-size:13px;}
.ps-ico-ok{color:var(--accent);margin-top:1px;flex-shrink:0;}
@media(max-width:760px){.ps-wrap{grid-template-columns:1fr;}}

/* SERVICES */
.srv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:52px auto 44px;max-width:1160px;}
.srv-card{background:var(--bg3);padding:38px 34px;border-top:3px solid transparent;transition:border-color .3s,box-shadow .3s;position:relative;overflow:hidden;}
.srv-card:hover{border-top-color:var(--accent);box-shadow:0 8px 40px rgba(0,0,0,.07);}
.srv-feat{border-top-color:var(--accent)!important;}
.srv-pop{position:absolute;top:0;right:0;background:var(--accent);color:#fff;font-family:var(--font-display);font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:4px 12px;font-weight:700;}
.srv-num{font-family:var(--font-display);font-size:44px;font-weight:800;color:var(--accent-dim);line-height:1;margin-bottom:18px;}
.srv-name{font-family:var(--font-display);font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px;color:var(--text);}
.srv-desc{color:var(--muted);font-size:14px;line-height:1.65;margin-bottom:22px;}
.srv-price{font-family:var(--font-display);font-size:25px;font-weight:700;color:var(--accent);letter-spacing:-.02em;}
.srv-note{font-size:12px;color:var(--muted);margin-top:3px;}
.srv-inc{margin-top:20px;display:flex;flex-direction:column;gap:8px;}
.srv-inc span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
.srv-inc .ck{color:var(--accent);}
@media(max-width:920px){.srv-grid{grid-template-columns:1fr;max-width:520px;}}

/* WHY */
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:52px;max-width:1160px;margin-left:auto;margin-right:auto;}
.why-card{padding:42px 34px;background:var(--bg3);border-bottom:3px solid transparent;transition:border-color .3s,box-shadow .3s;}
.why-card:hover{border-bottom-color:var(--accent);box-shadow:0 6px 30px rgba(0,0,0,.06);}
.why-ico{width:46px;height:46px;margin-bottom:22px;color:var(--accent);}
.why-title{font-family:var(--font-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;color:var(--text);}
.why-body{color:var(--muted);font-size:14px;line-height:1.7;}
.why-badge{display:inline-block;font-family:var(--font-display);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 10px;margin-top:14px;}
@media(max-width:760px){.why-grid{grid-template-columns:1fr;}}
@media(max-width:760px){.app-grid{grid-template-columns:1fr!important;}}

/* PORTFOLIO */
.port-grid{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:300px 240px;gap:3px;margin-top:46px;max-width:1160px;margin-left:auto;margin-right:auto;}
.port-cell{overflow:hidden;position:relative;cursor:pointer;}
.port-cell:first-child{grid-row:1/3;}
.port-inner{width:100%;height:100%;background:#d6d3cc;position:relative;overflow:hidden;transition:transform .6s ease;}
.port-cell:hover .port-inner{transform:scale(1.04);}
.port-stripe{width:100%;height:100%;}
.port-lbl{position:absolute;bottom:14px;left:14px;font-family:var(--font-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#fff;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.6);}
.port-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;transition:opacity .3s;backdrop-filter:blur(4px);}
.port-cell:hover .port-play{opacity:1;}
.port-type{position:absolute;top:12px;left:12px;font-family:var(--font-display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;z-index:2;backdrop-filter:blur(4px);}
.port-mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.08em;text-align:center;padding:0 16px;}
@media(max-width:760px){.port-grid{grid-template-columns:1fr 1fr;grid-template-rows:auto;}.port-cell:first-child{grid-row:auto;grid-column:1/3;height:220px;}.port-cell{height:150px;}}


/* PROCESS */
.proc-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:52px;max-width:1060px;margin-left:auto;margin-right:auto;position:relative;}
.proc-steps::before{content:'';position:absolute;top:29px;left:10%;right:10%;height:1px;background:linear-gradient(to right,transparent,var(--accent-dim) 20%,var(--accent-dim) 80%,transparent);}
.proc-step{padding:0 22px 0 0;}
/* ── HERO DRONE ── */
@keyframes prop-spin { to { transform: rotate(360deg); } }
@keyframes drone-bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.drone-wrap { position:absolute; z-index:3; pointer-events:none; }
.drone-body { animation:drone-bob 2.2s ease-in-out infinite; filter:drop-shadow(0 4px 14px rgba(0,0,0,.55)); }
.prop { transform-origin: 50% 50%; transform-box: fill-box; animation:prop-spin 0.12s linear infinite; }

/* end drone */
.proc-num{width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:21px;font-weight:800;color:#fff;background:var(--accent);position:relative;z-index:1;margin-bottom:22px;border-radius:50%;}
.proc-title{font-family:var(--font-display);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px;color:var(--text);}
.proc-body{font-size:14px;color:var(--muted);line-height:1.65;}
@media(max-width:760px){.proc-steps{grid-template-columns:1fr 1fr;gap:36px;}.proc-steps::before{display:none;}}
@media(max-width:480px){.proc-steps{grid-template-columns:1fr;}}

/* FINAL CTA */
.cta-sec{background:linear-gradient(135deg,#1c2e24 0%,#1c1a14 100%);color:#fff;text-align:center;padding:110px 5vw;position:relative;overflow:hidden;}
.cta-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(114,138,154,.2) 0%,transparent 65%);pointer-events:none;}
.cta-title{font-family:var(--font-display);font-size:clamp(42px,7vw,78px);font-weight:800;text-transform:uppercase;line-height:.93;margin-bottom:22px;letter-spacing:-.01em;position:relative;}
.cta-sub{color:rgba(255,255,255,.6);font-size:17px;margin-bottom:40px;font-weight:300;position:relative;}
.cta-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative;}
.urgency{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#ffa070;margin-bottom:18px;position:relative;}
.urgency-dot{display:inline-block;width:5px;height:5px;background:#ffa070;border-radius:50%;margin-right:7px;animation:blink 1.5s infinite;}

/* CONTACT */
.contact-wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px;max-width:1060px;margin:52px auto 0;}
.cinfo-item{display:flex;align-items:flex-start;gap:14px;margin-bottom:26px;}
.cinfo-ico{color:var(--accent);margin-top:2px;flex-shrink:0;}
.cinfo-lbl{font-family:var(--font-display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.cinfo-val{font-size:15px;color:var(--text);}
.cform{display:flex;flex-direction:column;gap:14px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ffield{display:flex;flex-direction:column;gap:5px;}
.ffield label{font-family:var(--font-display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.ffield input,.ffield textarea,.ffield select{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:15px;padding:11px 14px;outline:none;transition:border-color .2s;resize:none;}
.ffield input:focus,.ffield textarea:focus,.ffield select:focus{border-color:var(--accent-dim);}
.ffield textarea{min-height:108px;}
.fok{padding:28px;border:1px solid var(--accent-dim);background:rgba(114,138,154,.06);text-align:center;}
@media(max-width:760px){.contact-wrap{grid-template-columns:1fr;gap:36px;}.frow{grid-template-columns:1fr;}}

/* ── NAV ── */
function Nav() {
  const [scrolled, setScrolled] = useState(false);
  const [onHero, setOnHero] = useState(true);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const h = () => {
      setScrolled(window.scrollY > 40);
      const hero = document.getElementById('hero');
      if (hero) setOnHero(window.scrollY < hero.offsetHeight - 80);
    };
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);
  const links = [
    ['#services','Services'],['#why','Pourquoi nous'],
    ['#portfolio','Portfolio'],['#contact','Contact'],

    <>
      <nav className={`nav ${scrolled?'scrolled':''} ${onHero?'on-hero':''}`}>

/* ── HERO ── */
function Hero() {
  const vidRef = useRef(null);
  const [pos, setPos] = useState({ x: 10, y: 80, rot: -3 });

  useEffect(() => {
    const v = vidRef.current;
    if (!v) return;
    const fallbacks = [
      'https://videos.pexels.com/video-files/2169880/2169880-hd_1920_1080_25fps.mp4',
      'https://videos.pexels.com/video-files/1851190/1851190-hd_1280_720_25fps.mp4',
    ];
    let idx = 0;
    const tryNext = () => {
      if (idx >= fallbacks.length) return;
      v.src = fallbacks[idx++];
      v.load();
    };
    v.addEventListener('error', tryNext);
    return () => v.removeEventListener('error', tryNext);
  }, []);

  useEffect(() => {
    let rafId;
    let lastTime = null;
    let angle = 0;
    const animate = (timestamp) => {
      if (lastTime !== null) {
        const delta = (timestamp - lastTime) / 1000;
        angle += 0.55 * delta;
      }
      lastTime = timestamp;
      const centerY = window.innerHeight * 0.42;
      setPos({
        x: 50 + 24 * Math.cos(angle),
        y: centerY + 58 * Math.sin(angle),
        rot: -Math.sin(angle) * 18,
      });
      rafId = requestAnimationFrame(animate);
    };
    rafId = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(rafId);
  }, []);

  return (
    <section className="hero" id="hero">
      <div className="hero-vid-wrap">
        <video ref={vidRef} autoPlay muted loop playsInline preload="auto"
          src="https://videos.pexels.com/video-files/5031099/5031099-hd_1920_1080_30fps.mp4">
        </video>
      </div>
      <div className="hero-overlay"></div>

      <div className="drone-wrap" style={{
        left: `${pos.x}vw`,
        top: `${pos.y}px`,
        transform: `rotate(${pos.rot}deg)`,
      }}>
        <div className="drone-body"><DroneSVG /></div>
      </div>

      <div className="hero-content">
        <div style={{
          fontFamily:'var(--font-display)',
          fontSize:'clamp(72px,16vw,180px)',
          fontWeight:800,
          letterSpacing:'.14em',
          textTransform:'uppercase',
          color:'#fff',
          lineHeight:1,
          marginBottom:'22px',
          textShadow:'0 2px 50px rgba(0,0,0,.45)',
        }}>VERTEK</div>
        <div className="hero-badge">
          <span className="hero-dot"></span>
          Certifié A1 · DJI Mini 4 Pro · Disponible maintenant
        </div>
        <h1 className="hero-title">
          Vos visuels<br />depuis les <em>airs</em>
        </h1>
        <p className="hero-sub">
          Photo et vidéo aérienne professionnelle — qualité cinématographique, prix accessibles, intervention rapide.
        </p>
        <div className="hero-btns">
          <a href="#contact" className="btn btn-p">Obtenir un devis <Arr /></a>
          <a href="#contact" className="btn btn-w">Me contacter</a>
        </div>
      </div>
      <div className="hero-scroll">
        <div className="hero-scroll-line"></div>
        <span>Découvrir</span>
      </div>
    </section>
  );
}

/* ── PORTFOLIO ── */
function Portfolio() {
  const raw = (window.GALLERY && window.GALLERY.length > 0) ? window.GALLERY : [
    {file:'INSPECTION-PONTS-PAR-DRONE-DRONE-ON-AIR.jpg',type:'photo',tag:'Infrastructure'},
  ];

  const shuffled = React.useMemo(() => {
    const arr = [...raw];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }, []);

  const nameOf = file => file.replace(/\.[^.]+$/, '');

  const cells = shuffled.map(item => ({
    lbl: nameOf(item.file),
    type: item.tag,
    ...(item.type === 'video'
      ? { video: `uploads/${encodeURIComponent(item.file)}` }
      : { img: `uploads/${encodeURIComponent(item.file)}` }),
  }));
  return (
    <section className="sec" id="portfolio" style={{background:'var(--bg2)'}}>
      <div style={{maxWidth:'1160px',margin:'0 auto'}}>
        <div className="sec-lbl">Portfolio</div>
        <h2 className="sec-title">Nos réalisations</h2>
        <p className="sec-sub">Photos et vidéos réels — vos propres visuels peuvent rejoindre la galerie.</p>
      </div>
      <div className="port-grid">
        {cells.map((c,i)=>(
          <div key={i} className="port-cell">
            <div className="port-inner">
              {c.video ? (
                <video autoPlay muted loop playsInline src={c.video}
                  style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}
                  onError={e=>{
                    const v=e.currentTarget;
                    v.style.display='none';
                    if(c.img){
                      const img=document.createElement('img');
                      img.src=c.img;
                      img.style.cssText='width:100%;height:100%;object-fit:cover;display:block;';
                      v.parentNode.insertBefore(img,v);
                    }
                  }}
                />
              ) : (
                <img
                  src={c.img}
                  alt={c.lbl}
                  style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}
                  onError={e=>{
                    if(c.imgFallback && e.target.src !== c.imgFallback){
                      e.target.src = c.imgFallback;
                    } else {
                      e.target.style.display='none';
                    }
                  }}
                />
              )}
              <div className="port-type">{c.type}</div>
              <div className="port-play">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2.5l8 4.5-8 4.5V2.5z"/></svg>
              </div>
              <div className="port-lbl">{c.lbl}</div>
            </div>
          </div>
        ))}
      </div>
      <div style={{textAlign:'center',marginTop:'28px'}}>
        <a href="#contact" className="btn btn-g">Discuter de votre projet <Arr /></a>
      </div>
    </section>
  );
}

/* ── TWEAKS ── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#8a9a72",
  "darkMode": false,
  "showPrices": true,
  "urgencyBanner": false
}/*EDITMODE-END*/;

function TweaksPanel({tweaks,setTweaks,visible,onClose}) {
  if(!visible) return null;
  const set = (k,v) => {
    const next={...tweaks,[k]:v};
    setTweaks(next);
    window.parent.postMessage({type:'__edit_mode_set_keys',edits:next},'*');
  };
  const accents = ['#728a9a','#8a9a72','#9a7a8a','#7a9e8a','#9a8a72'];
  return (
    <div style={{position:'fixed',bottom:'24px',right:'24px',width:'256px',background:'#fff',border:'1px solid var(--border)',zIndex:9999,boxShadow:'0 12px 48px rgba(0,0,0,.14)',fontFamily:'var(--font-body)'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'13px 17px',borderBottom:'1px solid var(--border)'}}>
        <span style={{fontFamily:'var(--font-display)',fontSize:'11px',letterSpacing:'.2em',textTransform:'uppercase',color:'var(--muted)'}}>Tweaks</span>
        <button onClick={onClose} style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',lineHeight:1,fontSize:'14px'}}>✕</button>
      </div>
      <div style={{padding:'17px',display:'flex',flexDirection:'column',gap:'16px'}}>
        <div>
          <label style={{fontFamily:'var(--font-display)',fontSize:'10px',letterSpacing:'.2em',textTransform:'uppercase',color:'var(--accent)',display:'block',marginBottom:'8px'}}>Couleur d'accent</label>
          <div style={{display:'flex',gap:'7px'}}>
            {accents.map(c=>(
              <button key={c} onClick={()=>{set('accentColor',c);document.documentElement.style.setProperty('--accent',c);}} style={{width:'24px',height:'24px',background:c,border:tweaks.accentColor===c?'2px solid #333':'2px solid transparent',cursor:'pointer',borderRadius:'2px'}}></button>
            ))}
          </div>
        </div>
        <div>
          <label style={{fontFamily:'var(--font-display)',fontSize:'10px',letterSpacing:'.2em',textTransform:'uppercase',color:'var(--accent)',display:'block',marginBottom:'7px'}}>Bannière urgence</label>
          <button onClick={()=>set('urgencyBanner',!tweaks.urgencyBanner)} style={{fontFamily:'var(--font-display)',fontSize:'11px',letterSpacing:'.1em',textTransform:'uppercase',padding:'6px 14px',background:tweaks.urgencyBanner?'var(--accent)':'transparent',color:tweaks.urgencyBanner?'#fff':'var(--muted)',border:'1px solid var(--accent-dim)',cursor:'pointer'}}>
            {tweaks.urgencyBanner?'Affichée':'Masquée'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── APP ── */
function App() {
  const [tweaks,setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible,setTweaksVisible] = useState(false);
  useEffect(()=>{
    const h = e => {
      if(e.data?.type==='__activate_edit_mode') setTweaksVisible(true);
      if(e.data?.type==='__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return ()=>window.removeEventListener('message',h);
  },[]);
  useEffect(()=>{
    document.documentElement.style.setProperty('--accent',tweaks.accentColor);
  },[tweaks.accentColor]);
  return (
    <>
      <Nav />
      <Hero />
      <Trust />
      <ProblemSolution />
      <Services />
      <Why />
      <Portfolio />
      <Process />
      <FinalCTA />
      <Contact />
      <Footer />
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible} onClose={()=>{setTweaksVisible(false);window.parent.postMessage({type:'__edit_mode_dismissed'},'*');}} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
